<div class="authpage">
  <div class="authpage__brand">
    <span class="authpage__brand-icon"><lucide-icon [img]="HeartIcon" [size]="20"></lucide-icon></span>
    <strong>rastemo</strong>
  </div>

  <ui-card padding="lg" class="authpage__card">
    <h1>Dobrodošla nazad</h1>
    <p class="text-soft">Prijavi se da nastaviš svoje putovanje.</p>

    <form (ngSubmit)="submit()" class="authpage__form">
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="marija@email.com" />
      </label>
      <label>
        <span>Lozinka</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Tvoja lozinka" />
      </label>

      <p class="authpage__error" *ngIf="error()">{{ error() }}</p>

      <ui-button type="submit" variant="primary" size="lg" [fullWidth]="true" [disabled]="loading()">
        {{ loading() ? 'Prijavljivanje...' : 'Prijavi se' }}
      </ui-button>
    </form>

    <div class="authpage__divider"><span>ili</span></div>

    <ui-button variant="secondary" size="lg" [fullWidth]="true" (click)="withGoogle()">
      Nastavi sa Google nalogom
    </ui-button>

    <p class="authpage__switch">
      Nemaš nalog? <a routerLink="/register">Kreiraj ga</a>
    </p>
  </ui-card>
</div>
