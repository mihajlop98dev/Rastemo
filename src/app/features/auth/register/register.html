<div class="authpage">
  <a routerLink="/" class="authpage__brand">
    <span class="authpage__brand-icon"><lucide-icon [img]="HeartIcon" [size]="20"></lucide-icon></span>
    <strong>Dnevnik trudnoće</strong>
  </a>

  <ui-card padding="lg" class="authpage__card">
    <h1>Kreiraj nalog</h1>
    <p class="text-soft">Napravi svoj digitalni prostor za trudnoću.</p>

    <form (ngSubmit)="submit()" class="authpage__form">
      <label>
        <span>Ime i prezime</span>
        <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Marija Petrović"
               (blur)="predloziIme()" />
      </label>
      <label>
        <span>Korisničko ime</span>
        <input type="text" [(ngModel)]="username" name="username" placeholder="marija87"
               autocomplete="username" (input)="proveriIme()" />
        <small class="authpage__pomoc" [class.authpage__pomoc--lose]="stanjeImena() === 'zauzeto'">
          <ng-container [ngSwitch]="stanjeImena()">
            <ng-container *ngSwitchCase="'proveravam'">Proveravam…</ng-container>
            <ng-container *ngSwitchCase="'slobodno'">Slobodno je.</ng-container>
            <ng-container *ngSwitchCase="'zauzeto'">Zauzeto ili nije dozvoljeno.</ng-container>
            <ng-container *ngSwitchDefault>
              Ovim se potpisuješ na forumu — tvoje pravo ime tamo se ne prikazuje.
              Njime možeš i da se prijaviš.
            </ng-container>
          </ng-container>
        </small>
      </label>
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="marija@email.com" />
      </label>
      <label>
        <span>Lozinka</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Minimum 6 karaktera" />
      </label>

      <label class="authpage__consent">
        <input type="checkbox" [(ngModel)]="acceptedTerms" name="acceptedTerms" />
        <span>
          Pročitala sam i prihvatam
          <a routerLink="/uslovi-koriscenja" target="_blank">Uslove korišćenja</a> i
          <a routerLink="/politika-privatnosti" target="_blank">Politiku privatnosti</a>.
          Razumem da je Dnevnik trudnoće informativnog karaktera i da ne zamenjuje savet lekara.
        </span>
      </label>

      <p class="authpage__error" *ngIf="error()">{{ error() }}</p>

      <ui-button type="submit" variant="primary" size="lg" [fullWidth]="true" [disabled]="loading()">
        {{ loading() ? 'Kreiranje naloga...' : 'Kreiraj nalog' }}
      </ui-button>
    </form>

    <div class="authpage__divider"><span>ili</span></div>

    <ui-button variant="secondary" size="lg" [fullWidth]="true" (click)="withGoogle()">
      Nastavi sa Google nalogom
    </ui-button>

    <p class="authpage__switch">
      Već imaš nalog? <a routerLink="/login">Prijavi se</a>
    </p>
  </ui-card>

  <a routerLink="/" class="authpage__nazad">← Nazad na sajt</a>
</div>
