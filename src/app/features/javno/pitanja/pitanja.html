<div class="strana">
  <header class="strana__zaglavlje">
    <h1>Česta pitanja</h1>
    <p>Ako ovde ne nađeš odgovor, <a routerLink="/kontakt">piši nam</a> — odgovaramo lično.</p>
  </header>

  <section *ngFor="let g of grupe; let gi = index" class="pitanja__grupa">
    <h2>{{ g.naslov }}</h2>

    <ui-card padding="md" class="pitanja__kartica" *ngFor="let p of g.pitanja; let pi = index">
      <button type="button" class="pitanja__pitanje"
              [attr.aria-expanded]="otvoreno() === redni(gi, pi)"
              (click)="prebaci(redni(gi, pi))">
        <span>{{ p.pitanje }}</span>
        <span class="pitanja__znak">{{ otvoreno() === redni(gi, pi) ? '−' : '+' }}</span>
      </button>
      <p class="pitanja__odgovor" *ngIf="otvoreno() === redni(gi, pi)">{{ p.odgovor }}</p>
    </ui-card>
  </section>

  <ui-card padding="lg" class="strana__poziv">
    <h2>Još uvek nemaš nalog?</h2>
    <p>Otvaranje traje minut, a ne košta ništa.</p>
    <ui-button routerLink="/register" variant="primary" size="lg">Otvori svoj dnevnik</ui-button>
  </ui-card>
</div>
