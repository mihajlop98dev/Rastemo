<div class="thread">

  <header class="thread__header">
    <a routerLink="/messages" class="text-muted thread__back">
      <lucide-icon [img]="BackIcon" [size]="16"></lucide-icon>
    </a>
    <ui-avatar [name]="otherName()" size="md" />
    <strong>{{ otherName() }}</strong>
  </header>

  <ui-card padding="none" class="thread__chat">
    <div class="thread__messages">
      <div
        *ngFor="let m of messagesSvc.messages()"
        class="thread__message"
        [ngClass]="isMine(m.sender_id) ? 'thread__message--mine' : 'thread__message--theirs'">
        <div class="thread__bubble">
          {{ m.content }}
          <span class="thread__time">{{ formatTime(m.created_at) }}</span>
        </div>
      </div>

      <p class="text-soft thread__empty" *ngIf="!messagesSvc.messages().length">
        Još uvek nema poruka. Pošalji prvu!
      </p>
    </div>

    <form class="thread__composer" (ngSubmit)="send()">
      <input type="text" [(ngModel)]="draft" name="draft" placeholder="Napiši poruku..." />
      <button type="submit" class="thread__send" [disabled]="!draft.trim()">
        <lucide-icon [img]="SendIcon" [size]="17"></lucide-icon>
      </button>
    </form>
  </ui-card>
</div>
