<div class="mom-visual" [ngClass]="'mom-visual--' + size">
  <svg viewBox="0 0 320 380" class="mom-visual__backdrop">
    <defs>
      <radialGradient id="mvBackdrop" cx="50%" cy="38%" r="62%">
        <stop offset="0%" stop-color="var(--color-primary-light)" />
        <stop offset="100%" stop-color="var(--color-peach-light)" />
      </radialGradient>
    </defs>
    <circle cx="160" cy="190" r="170" fill="url(#mvBackdrop)" />
    <circle cx="60" cy="80" r="5" class="mom-visual__sparkle" />
    <circle cx="270" cy="120" r="4" class="mom-visual__sparkle" />
    <circle cx="255" cy="300" r="6" class="mom-visual__sparkle" />
    <circle cx="45" cy="290" r="3.5" class="mom-visual__sparkle" />
  </svg>

  <svg viewBox="0 0 320 380" class="mom-visual__figure">
    <defs>
      <linearGradient id="mvBody" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--color-primary)" />
        <stop offset="100%" stop-color="var(--color-primary-dark)" />
      </linearGradient>
    </defs>

    <!-- hair, swept back behind the head -->
    <path
      class="mom-visual__hair"
      d="M170 35 C158 32 150 44 152 60 C153 70 160 78 170 80
         C165 66 165 48 170 35 Z" />

    <!-- head -->
    <circle class="mom-visual__skin" cx="190" cy="52" r="23" />

    <!-- pregnant silhouette built from overlapping rounded shapes: small chest, big round belly, tapered hem -->
    <ellipse class="mom-visual__body" fill="url(#mvBody)" cx="175" cy="95" rx="24" ry="28" />
    <ellipse class="mom-visual__body" fill="url(#mvBody)" cx="178" cy="288" rx="44" ry="40" />
    <circle class="mom-visual__body" fill="url(#mvBody)" cx="192" cy="196" r="70" />

    <!-- arm resting across the top of the belly -->
    <path
      class="mom-visual__detail"
      d="M215 130 C240 145 250 170 244 195 C240 212 222 220 205 215"
      fill="none" stroke-linecap="round" />
  </svg>
</div>
